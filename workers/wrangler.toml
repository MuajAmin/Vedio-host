name = "videohost-edge"
main = "src/worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

# ─── R2 Bucket Binding ──────────────────────────────────────────────
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "videohost"

# ─── Secrets (set via CLI) ───────────────────────────────────────────
# SESSION_SECRET — same value as your VPS .env SESSION_SECRET
# Set with: npx wrangler secret put SESSION_SECRET
