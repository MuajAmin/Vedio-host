name = "videohost-edge"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── Route ───────────────────────────────────────────────────────────
# Your domain muaj.bro.bd uses a CNAME/partial zone setup — the zone "bro.bd"
# is not directly owned by your Cloudflare account. To attach this Worker:
#
# Option 1: Add a Custom Domain in Cloudflare Dashboard:
#   Workers & Pages → videohost-edge → Settings → Domains & Routes → Add → Custom Domain
#   Enter: muaj.bro.bd
#
# Option 2: Add a Worker Route in the Cloudflare Dashboard manually:
#   Go to your domain → Workers Routes → Add Route
#   Pattern: muaj.bro.bd/* → Worker: videohost-edge

# ─── Environment Variables ───────────────────────────────────────────
# Set via `wrangler secret put` or Cloudflare Dashboard:
#   SESSION_SECRET   — same value as your VPS .env SESSION_SECRET
#   WT_SHARED_SECRET — shared HMAC key for Watch Together auth tokens
[vars]
ORIGIN = "https://muaj.bro.bd"

# ─── Build ───────────────────────────────────────────────────────────
[build]
command = ""

# ─── R2 Bucket Binding ──────────────────────────────────────────────
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "videohost"

# ─── Durable Objects — Watch Together Rooms ──────────────────────────
# Each Watch Together session maps 1:1 to a WatchRoom Durable Object.
# WebSocket connections, playback sync, and chat all live at the edge.
[durable_objects]
bindings = [
  { name = "WATCH_ROOM", class_name = "WatchRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["WatchRoom"]

