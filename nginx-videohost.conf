# ==============================================================================
#  VideoHost - High-Performance Nginx Configuration (1 vCPU / 1 GB RAM VPS)
#  Domain: muaj.bro.bd / www.muaj.bro.bd
#  Root: /var/www/videohosk
# ==============================================================================

# Upstream Node.js application
upstream videohost_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name muaj.bro.bd www.muaj.bro.bd;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Main HTTPS Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muaj.bro.bd www.muaj.bro.bd;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/muaj.bro.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muaj.bro.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # General Performance & Size Limits
    # --------------------------------------------------------------------------
    client_max_body_size 550M; # Max upload size for video files
    client_body_buffer_size 512k;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;
    keepalive_timeout 75s;

    # Optimize TCP buffer handling
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # 3. Internal Video Streaming (X-Accel-Redirect)
    # --------------------------------------------------------------------------
    # Node.js authenticates requests and issues X-Accel-Redirect header.
    # Nginx streams directly from disk using kernel zero-copy sendfile.
    # --------------------------------------------------------------------------
    location /internal-videos/ {
        internal; # Crucial: cannot be accessed directly by users, only via Node.js
        alias /var/www/videohosk/uploads/videos/;

        # Kernel-level zero-copy file transmission
        sendfile on;
        sendfile_max_chunk 512k;

        # Disable gzip for video/audio binaries
        gzip off;

        # Async I/O & directio to protect 1GB VPS RAM from buffer cache eviction
        aio threads;
        directio 4m;
        output_buffers 2 512k;

        # MP4 pseudo-streaming — Nginx understands the MP4 container format
        # and can serve any seek position without scanning from the beginning.
        # This dramatically improves seek responsiveness for MP4/M4V files.
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;

        # Bandwidth management — fast initial burst, then sustainable throttle.
        # First 5MB at full speed (fills the initial playback buffer quickly),
        # then cap at 1MB/s (~8 Mbps) per stream to prevent a single viewer
        # from saturating the VPS uplink and starving other connections.
        limit_rate_after 5m;
        limit_rate 1m;

        # Byte range requests (HTTP 206 Partial Content) for instant seeking
        # max_ranges is intentionally left at default (unlimited) to allow
        # proper 206 range responses — required for video seeking & streaming.

        # Streaming Headers
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=86400, no-transform" always;
        add_header X-Content-Type-Options nosniff always;

        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/x-matroska mkv;
            video/quicktime mov;
            video/x-msvideo avi;
            video/x-flv flv;
            video/x-ms-wmv wmv;
            audio/webm weba;
            audio/ogg ogg;
            audio/mpeg mp3;
            audio/wav wav;
        }

        # Disable temp buffering
        proxy_max_temp_file_size 0;
    }

    # --------------------------------------------------------------------------
    # 4. Static Assets (CSS, JS, Fonts, Images, Manifest)
    # --------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|webmanifest)$ {
        root /var/www/videohosk/public;
        try_files $uri @proxy_to_node;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;

        sendfile on;
        tcp_nodelay on;
    }

    # --------------------------------------------------------------------------
    # 5. Server-Sent Events (SSE) & Real-time Streams
    # --------------------------------------------------------------------------
    # Watch Together, Messaging, Presence, Calling & Import Progress
    # --------------------------------------------------------------------------
    location ~* ^/(import-progress|watch-together/stream|messages/stream|api/call/events) {
        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so real-time events push immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 6. WebRTC Calling API & Signaling
    # --------------------------------------------------------------------------
    location ~* ^/api/call/ {
        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 7. Main Node.js Application Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't buffer large upload request bodies in RAM — stream directly to Node.js
        proxy_request_buffering off;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer configuration for HTML responses
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # Fallback named location for static assets not found in /public
    location @proxy_to_node {
        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
