# ==============================================================================
#  VideoHost - High-Performance Nginx Configuration (1 vCPU / 1 GB RAM VPS)
#  Domain: muaj.bro.bd / www.muaj.bro.bd
#  Root: /var/www/videohosk
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream Node.js application
upstream videohost_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name origin.muaj.bro.bd;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Main HTTPS Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # HTTP/3 (QUIC) — optional for Nginx >= 1.25.0 with --with-http_v3_module
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    server_name origin.muaj.bro.bd;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/muaj.bro.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muaj.bro.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # General Performance & Size Limits
    # --------------------------------------------------------------------------
    client_max_body_size 550M; # Max upload size for video files
    client_body_buffer_size 512k;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;
    keepalive_timeout 75s;
    server_tokens off;

    # Optimize TCP buffer handling
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # Open File Descriptor Cache (Ultra-lightweight metadata caching in RAM)
    # --------------------------------------------------------------------------
    open_file_cache max=5000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --------------------------------------------------------------------------
    # 3. Internal Video Streaming (X-Accel-Redirect)
    # --------------------------------------------------------------------------
    # Node.js authenticates requests and issues X-Accel-Redirect header.
    # Nginx streams directly from disk using kernel zero-copy sendfile.
    # --------------------------------------------------------------------------
    location ^~ /internal-videos/ {
        internal; # Crucial: cannot be accessed directly by users, only via Node.js
        alias /var/www/videohosk/uploads/videos/;

        # Kernel-level zero-copy file transmission
        sendfile on;
        sendfile_max_chunk 512k;

        # Disable gzip for video/audio binaries
        gzip off;

        # Async I/O & directio to protect 1GB VPS RAM from buffer cache eviction
        aio threads;
        directio 4m;
        output_buffers 2 512k;

        # Byte range requests (HTTP 206 Partial Content) for instant seeking
        # max_ranges is intentionally left at default (unlimited) to allow
        # proper 206 range responses — required for video seeking & streaming.

        # Streaming Headers
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=86400, no-transform" always;
        add_header X-Content-Type-Options nosniff always;

        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/x-matroska mkv;
            video/quicktime mov;
            video/x-msvideo avi;
            video/x-flv flv;
            video/x-ms-wmv wmv;
            audio/webm weba;
            audio/ogg ogg;
            audio/mpeg mp3;
            audio/wav wav;
        }

        # Disable temp buffering
        proxy_max_temp_file_size 0;
    }

    # --------------------------------------------------------------------------
    # 3.1. Direct Media Serving (Thumbnails & Avatars - Kernel zero-copy sendfile)
    # --------------------------------------------------------------------------
    location ^~ /thumbnails/ {
        alias /var/www/videohosk/uploads/thumbnails/;
        sendfile on;
        tcp_nodelay on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /avatars/ {
        alias /var/www/videohosk/uploads/avatars/;
        sendfile on;
        tcp_nodelay on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /internal-thumbnails/ {
        internal;
        alias /var/www/videohosk/uploads/thumbnails/;
        sendfile on;
        tcp_nodelay on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /internal-avatars/ {
        internal;
        alias /var/www/videohosk/uploads/avatars/;
        sendfile on;
        tcp_nodelay on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /internal-voice/ {
        internal;
        alias /var/www/videohosk/uploads/voice/;
        sendfile on;
        tcp_nodelay on;
        expires 7d;
        add_header Cache-Control "private, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # --------------------------------------------------------------------------
    # 4. Static Assets (CSS, JS, Fonts, Images, Manifest)
    # --------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|webmanifest)$ {
        root /var/www/videohosk/public;
        try_files $uri @proxy_to_node;

        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;

        sendfile on;
        tcp_nodelay on;
    }

    # --------------------------------------------------------------------------
    # 5. Server-Sent Events (SSE) & Real-time Streams
    # --------------------------------------------------------------------------
    # Watch Together, Messaging, Presence, Calling & Import Progress
    # --------------------------------------------------------------------------
    location ~* ^/(import-progress|watch-together/stream|messages/stream|api/call/events|api/r2-progress) {
        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so real-time events push immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 6. WebRTC Calling API & Signaling
    # --------------------------------------------------------------------------
    location ~* ^/api/call/ {
        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 7. Main Node.js Application Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't buffer large upload request bodies in RAM — stream directly to Node.js
        proxy_request_buffering off;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer configuration for HTML responses
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # Fallback named location for static assets not found in /public
    location @proxy_to_node {
        proxy_pass http://videohost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
#  3. muaj.bro.bd / www.muaj.bro.bd  ->  Cloudflare Worker (308 Permanent)
#  Added: 2026-08-29
#
#  WHY THIS EXISTS
#  The public hostname muaj.bro.bd cannot be attached to Cloudflare as a custom
#  domain, because the root domain (bro.bd) is not under our control. The
#  redirect to the workers.dev hostname is therefore performed here in Nginx
#  instead of at the Cloudflare edge.
#
#  WHY origin.muaj.bro.bd IS NOT REDIRECTED
#  The Worker fetches real content back from the VPS using ORIGIN_URL
#  (https://origin.muaj.bro.bd) while overriding the Host header to
#  "muaj.bro.bd". Nginx routes by Host header, so redirecting that hostname
#  would send the Worker's own origin fetch a redirect back to itself —
#  an infinite Worker -> Nginx -> Worker loop. The origin hostname keeps
#  serving the Node/Bun application, and requests carrying the Worker's
#  X-Edge-Worker-Loop header are additionally exempted below.
#
#  WHY 308 AND NOT 301
#  A 301 makes browsers downgrade POST to GET and drop the request body,
#  which silently breaks logins, uploads and API POSTs. 308 has identical
#  "permanent" caching/SEO semantics but preserves method and body.
#
#  WHY THE REDIRECT IS INSIDE "location /"
#  A server-level `return` executes during Nginx's rewrite phase, before any
#  location content handler, so it would pre-empt the ACME challenge block and
#  break Let's Encrypt HTTP-01 renewal. Keeping the redirect inside
#  "location /" lets the "^~" ACME prefix win.
# ==============================================================================

# ---- HTTP :80 -> Worker ------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name muaj.bro.bd www.muaj.bro.bd;

    server_tokens off;

    # Let's Encrypt HTTP-01 must be served locally, never redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        # Worker origin pulls set this header — serve the app, never redirect.
        if ($http_x_edge_worker_loop) {
            proxy_pass http://videohost_upstream;
            break;
        }
        return 308 https://videohost-edge.muajamin2021.workers.dev$request_uri;
    }
}

# ---- HTTPS :443 -> Worker ----------------------------------------------------
# Required: without this block, https://muaj.bro.bd would fall through to the
# origin server block and serve the application instead of redirecting.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muaj.bro.bd www.muaj.bro.bd;

    # Reuse the existing Certbot certificate (already covers muaj.bro.bd)
    ssl_certificate /etc/letsencrypt/live/muaj.bro.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muaj.bro.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        if ($http_x_edge_worker_loop) {
            proxy_pass http://videohost_upstream;
            break;
        }
        return 308 https://videohost-edge.muajamin2021.workers.dev$request_uri;
    }
}
